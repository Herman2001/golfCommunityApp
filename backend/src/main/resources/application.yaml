spring:
  application:
    name: golf-community-api
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    # Standardvärdena matchar compose.yaml och används bara lokalt.
    # I molnet sätts DB_URL, DB_USERNAME och DB_PASSWORD som miljövariabler.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/golfcommunity}
    username: ${DB_USERNAME:golf}
    password: ${DB_PASSWORD:golf}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: ${PORT:8080}

app:
  jwt:
    # Standardnyckeln är ENDAST för lokal utveckling. Sätt JWT_SECRET (minst 32 tecken) i produktion.
    secret: ${JWT_SECRET:local-dev-secret-change-me-before-deploying-0123456789}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:10080}
  seed:
    # Skapar två demoanvändare och några inlägg om databasen saknar inlägg.
    demo-data: ${SEED_DEMO_DATA:true}
  uploads:
    dir: ${UPLOADS_DIR:uploads}
