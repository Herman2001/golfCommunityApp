name: golf-community

services:
  postgres:
    image: postgres:17
    container_name: golf-community-db
    environment:
      POSTGRES_DB: golfcommunity
      POSTGRES_USER: golf
      POSTGRES_PASSWORD: golf
    ports:
      - "5432:5432"
    volumes:
      - golf-community-data:/var/lib/postgresql/data

volumes:
  golf-community-data:
